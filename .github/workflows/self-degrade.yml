# Drill for slice 2 on autopilot-hub itself. Runs the degrade workflow from the default branch
# (push / workflow_run / issues events always use the workflow file on the default branch).
# Drill: label any issue `autopilot:freeze` -> a degrade issue (L0) opens; the next PR's admission
# lists it under `limits`; closing the degrade issue lifts it.
name: self-degrade

on:
  push:
    branches: [main]
  # Only reads workflow_run results; never checks out or executes PR code. Hub checkup C9 guards this separately.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]
    branches: [main]
  issues:
    types: [labeled]

# plugin-standard C8: nothing at the top level; each job asks for what it needs.
permissions: {}

jobs:
  degrade:
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: read
    uses: ./.github/workflows/degrade.yml
    with:
      hub_ref: ${{ github.sha }}

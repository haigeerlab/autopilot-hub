# Reusable workflow: admission (report-only): can this PR merge automatically? Spec: docs/spec/slice-7.md
#
# Callers pin BOTH the `uses:` ref and `hub_ref` to the same 40-char commit SHA of autopilot-hub,
# see examples/caller-autopilot-admission.yml. Updating that SHA in a caller repo is a T4 change.
#
# Safety:
# - Triggered by the caller's `pull_request` event (never pull_request_target).
# - Never checks out or runs PR code. The risk config is read from the BASE branch via the API.
# - The merge setting comes from the latest `autopilot-takeover:v1` PR comment written by the local orchestrator;
#   only comments by the App bot in the hub's bot-identity.json that were never edited count (slice 8).
# - The hard gate reads the bot's `autopilot-evidence:v1` or `autopilot-evidence:v2` comment bound to HEAD_SHA (slice 9).
# - All event values reach shell only through env vars, never inlined into `run:` scripts.
# - The check run is always `neutral`: it reports eligibility, it never blocks.
name: autopilot-admission

on:
  workflow_call:
    inputs:
      hub_ref:
        description: "40-char autopilot-hub commit SHA; must equal the SHA in the caller's `uses:` line"
        required: true
        type: string

# plugin-standard C8: nothing at the top level; each job asks for what it needs.
permissions: {}

jobs:
  admission:
    permissions:
      contents: read
      checks: write
      pull-requests: write
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      HUB_REF: ${{ inputs.hub_ref }}
    steps:
      - name: Check hub_ref is a full commit SHA
        run: |
          case "${HUB_REF}" in
            *[!0-9a-f]*|"") echo "::error::hub_ref must be a 40-char lowercase commit SHA"; exit 2 ;;
          esac
          [ "${#HUB_REF}" -eq 40 ] || { echo "::error::hub_ref must be 40 chars"; exit 2; }

      - name: Check out autopilot-hub at the pinned SHA (scripts only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haigeerlab/autopilot-hub
          ref: ${{ inputs.hub_ref }}
          path: .hub
          persist-credentials: false

      - name: Collect inputs from the base branch and the PR (read-only API calls)
        run: |
          mkdir -p .admission
          fetch() {  # $1 = repo path, $2 = output file; absent file stays absent
            if gh api "repos/${REPO}/contents/$1?ref=${BASE_REF}" --jq .content > .admission/b64 2>/dev/null; then
              base64 -d < .admission/b64 > "$2" || rm -f "$2"
            fi
          }
          gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq '[.[] | {id, body, user: {login: .user.login, id: .user.id, type: .user.type}, app: .performed_via_github_app.slug, created_at, updated_at}]' | python3 -c 'import json,sys;print(json.dumps([b for page in sys.stdin.read().split("\n") if page.strip() for b in json.loads(page)]))' > .admission/comments.json || echo '[]' > .admission/comments.json
          fetch .github/autopr/risk-tiers.yml .admission/risk-tiers.yml
          fetch .github/autopr/risk-tiers.json .admission/risk-tiers.json
          gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" --paginate --jq '[.[] | {filename, status, additions, deletions, patch}]' \
            | python3 -c 'import json,sys;print(json.dumps([f for page in sys.stdin.read().split("\n") if page.strip() for f in json.loads(page)]))' > .admission/files.json
          gh issue list -R "${REPO}" --label autopilot:degrade --state open --limit 200 --json number,body > .admission/degrade.json || echo '[]' > .admission/degrade.json

      - name: Decide
        run: |
          python3 -B .hub/admission/cli.py \
            --comments .admission/comments.json \
            --degrade-issues .admission/degrade.json \
            --pr-files .admission/files.json \
            --risk-config-yml .admission/risk-tiers.yml \
            --risk-config-json .admission/risk-tiers.json \
            --repo "${REPO}" \
            --head-sha "${HEAD_SHA}" \
            --out-json .admission/result.json --out-md .admission/summary.md
          cat .admission/summary.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Fork PR note
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: echo "fork PR：token 只读，不写检查结果、标签和评论；结论见本次运行的 Summary。" >> "${GITHUB_STEP_SUMMARY}"

      - name: Publish neutral check run, label and summary comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          TIER="$(python3 -c 'import json;print(json.load(open(".admission/result.json"))["risk"]["tier"])')"
          TITLE="$(python3 -c 'import json;print(json.load(open(".admission/result.json"))["headline"])')"
          python3 - <<'PY' > .admission/check.json
          import json, os
          print(json.dumps({
              "name": "autopilot/admission",
              "head_sha": os.environ["HEAD_SHA"],
              "status": "completed",
              "conclusion": "neutral",
              "output": {"title": json.load(open(".admission/result.json"))["headline"],
                         "summary": open(".admission/summary.md", encoding="utf-8").read()[:60000]},
          }, ensure_ascii=False))
          PY
          gh api "repos/${REPO}/check-runs" --method POST --input .admission/check.json > /dev/null

          for tier in T0 T1 T2 T3 T4; do
            [ "${tier}" = "${TIER}" ] && continue
            gh api "repos/${REPO}/issues/${PR_NUMBER}/labels/autopilot:risk-${tier}" --method DELETE > /dev/null 2>&1 || true
          done
          gh label create "autopilot:risk-${TIER}" -R "${REPO}" --color BFD4F2 --description "autopilot 风险档（只报告）" > /dev/null 2>&1 || true
          gh api "repos/${REPO}/issues/${PR_NUMBER}/labels" --method POST -f "labels[]=autopilot:risk-${TIER}" > /dev/null

          COMMENT_ID="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq '[.[] | select(.user.login == "github-actions[bot]") | select(.body | startswith("<!-- autopilot-admission -->") or startswith("<!-- autopr-admission -->"))][0].id // empty')"
          python3 -c 'import json;print(json.dumps({"body":open(".admission/summary.md",encoding="utf-8").read()},ensure_ascii=False))' > .admission/comment.json
          if [ -n "${COMMENT_ID}" ]; then
            gh api "repos/${REPO}/issues/comments/${COMMENT_ID}" --method PATCH --input .admission/comment.json > /dev/null
          else
            gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --method POST --input .admission/comment.json > /dev/null
          fi
          echo "published ${TIER}: ${TITLE}"

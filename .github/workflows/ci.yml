# CI for autopilot-hub itself: unit tests.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# plugin-standard C8: nothing at the top level; each job asks for what it needs.
permissions: {}

jobs:
  test:
    timeout-minutes: 5
    permissions:
      contents: read
    # plugin-standard C4: the macOS system Python users actually run (3.9) and a current one.
    # setup-python has no 3.9 build for the current Ubuntu image, so 3.9 is the macOS runner's /usr/bin/python3.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: macos-system, os: macos-latest, python: ""}
          - {name: "3.13", os: ubuntu-latest, python: "3.13"}
    name: test (${{ matrix.name }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: matrix.python != ''
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (stdlib only, verbose per test)
        env:
          PY: ${{ matrix.python == '' && '/usr/bin/python3' || 'python3' }}
        run: |
          "$PY" --version
          "$PY" -c 'import sys; assert sys.version_info >= (3, 9), sys.version'
          PYTHON="$PY" bash scripts/validate.sh
      - name: Working tree still clean (plugin-standard C10)
        run: git diff --exit-code

  # plugin-standard C1: the only required check on main. It runs even when a job fails or is cancelled
  # (if: always()) and fails unless every job it needs succeeded, so adding or renaming jobs never touches
  # the branch protection settings. This workflow has no path filter, so the check always reports.
  ci-required:
    name: CI required
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Every CI job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$NEEDS" | python3 -c '
          import json, sys
          bad = {job: r["result"] for job, r in json.load(sys.stdin).items() if r["result"] != "success"}
          print(bad or "all CI jobs succeeded")
          sys.exit(1 if bad else 0)'

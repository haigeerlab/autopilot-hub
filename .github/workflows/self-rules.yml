# Smoke test: autopilot-hub runs its own rule checks on its own PRs, with the scripts from the PR head.
# Report-only: the check runs autopilot/rule/* are not required.
name: self-rules

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

# plugin-standard C8: nothing at the top level; each job asks for what it needs.
permissions: {}

jobs:
  rules:
    permissions:
      contents: read
      checks: write
      pull-requests: read
    uses: ./.github/workflows/rules.yml
    with:
      hub_ref: ${{ github.event.pull_request.head.sha }}
